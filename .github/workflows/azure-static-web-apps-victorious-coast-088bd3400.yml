name: Azure Static Web Apps CI/CD

on:
  push:
    branches:
      - 2Branch
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - 2Branch

jobs:
  build_and_deploy_job:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v3
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.413'
      - name: Restore NuGet packages
        run: dotnet restore ./api/DlpFunctions.csproj
      - name: Build Azure Functions
        run: dotnet build ./api/DlpFunctions.csproj --configuration Release --output ./output
      - name: Deploy to Azure Functions
        uses: Azure/functions-action@v1
        with:
          app-name: dlp-servey-fc-bhcyaqe0e6c6andct
          package: ./output
          publish-profile: ${{ secrets.AZURE_FUNCTIONAPP_PUBLISH_PROFILE }}

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: windows-latest
    name: Close Pull Request Job
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@v1
        with:
          action: "close"
