name: -Frontend-Deploy frontend to Azure Static Web Apps

on:
  push:
    branches:
      #- 2Branch # for DLPSurvey RG
      -dev # for assessmenttool RG
      #-main # for assessmenttool RG
  workflow_dispatch:

jobs:
  frontend_deploy_job:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Build frontend
        run: |
          npm install
          npm run build
        env: 
          VITE_APP_GET_SURVEY_API_URL: https://dlp-servey-fc-bhcyape0e6c8andt.eastasia-01.azurewebsites.net/api/GetSurveyQuestions # for 2Branch
          VITE_SUBMIT_SURVEY_API_URL: https://dlp-servey-fc-bhcyape0e6c8andt.eastasia-01.azurewebsites.net/api/SubmitSurveyAnswers # for 2Branch

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: "upload"
          app_location: "/"
          output_location: "dist"